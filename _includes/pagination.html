{% if paginator.total_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if paginator.previous_page %}
  <a href="{{ paginator.previous_page_path }}" rel="prev">Newer</a>
  {% endif %}
  {% if paginator.next_page %}
  <a href="{{ paginator.next_page_path }}" rel="next">Older</a>
  {% endif %}
</nav>
{% endif %}
